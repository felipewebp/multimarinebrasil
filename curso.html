<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curso | MultiMarine</title><link rel="stylesheet" href="styles.css"><style>.course{max-width:1100px;margin:auto;padding:60px 7vw}.course-hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.course-img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#08243b}.course h1{font:700 clamp(38px,5vw,68px)/1 Space Grotesk;color:#08243b}.course-copy{color:#526878;line-height:1.8}.course-body{margin-top:45px;background:#fff;padding:35px;border:1px solid #e0e8ee;line-height:1.8;color:#526878;white-space:pre-line}.course-cta{display:inline-block;background:#dd0f0f;color:#fff;padding:15px 22px;font-weight:800;margin-top:20px}@media(max-width:800px){.course-hero{grid-template-columns:1fr}}</style></head><body><header class="nav"><a class="brand" href="index.html">MULTIMARINE DO BRASIL</a><a href="cursos.html">← Catálogo</a></header><main class="course" id="app"></main><script src="courses-data.js"></script><script>const slug=new URLSearchParams(location.search).get("slug"),all=window.MULTIMARINE_COURSES||[],c=all.find(x=>x.slug===slug)||all.find(x=>x.url&&x.url.includes(slug)),app=document.getElementById("app");if(!c){app.innerHTML="<h1>Curso não encontrado.</h1><a href='cursos.html'>Voltar ao catálogo</a>"}else{const wa="https://wa.me/5522996172167?text="+encodeURIComponent("Olá, gostaria de informações sobre o curso "+c.name);app.innerHTML='<section class="course-hero"><div><small>MULTIMARINE · MACAÉ/RJ</small><h1>'+c.name+'</h1><p class="course-copy">'+(c.description||"Consulte a equipe MultiMarine para informações sobre este curso.")+'</p><a class="course-cta" target="_blank" href="'+wa+'">FALAR NO WHATSAPP ↗</a></div>'+(c.image?'<img class="course-img" src="'+c.image+'" alt="'+c.name+'">':"")+'</section><section class="course-body"><h2>Informações do curso</h2>'+(c.description||"Consulte a equipe para carga horária, modalidade, requisitos, conteúdo e disponibilidade.")+'</section>'}}</script></body></html>
