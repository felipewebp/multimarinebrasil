name: Build páginas SEO

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/build-site.mjs"
      - "courses-data.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: node scripts/build-site.mjs
      - name: Commit páginas geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cursos sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Build sem alterações."
          else
            git commit -m "Atualizar páginas SEO geradas"
            git push
          fi
